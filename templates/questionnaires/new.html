{% extends "base.html" %}

{% block title %}Nouveau questionnaire - CedricIA{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Nouveau questionnaire</h1>
</div>

<form method="POST" class="form-standard">
    <div class="form-row">
        <div class="form-group">
            <label for="name">Nom *</label>
            <input type="text" id="name" name="name" required value="{{ form.get('name', '') }}">
        </div>
        <div class="form-group">
            <label for="short_name">Sigle</label>
            <input type="text" id="short_name" name="short_name" value="{{ form.get('short_name', '') }}">
        </div>
    </div>

    <div class="form-group">
        <label for="category">Catégorie</label>
        <input type="text" id="category" name="category" value="{{ form.get('category', '') }}">
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="2">{{ form.get('description', '') }}</textarea>
    </div>

    <div class="form-group">
        <label for="questions_json">Questions (format JSON)</label>
        <textarea id="questions_json" name="questions_json" rows="10" class="mono"
                  placeholder='[{"id": 1, "text": "Je me sens tendu(e)", "options": ["Jamais", "Parfois", "Souvent"], "scores": [0, 1, 2]}]'>{{ form.get('questions_json', '') }}</textarea>
        <small>Une liste de questions. Chaque question : <code>id</code>, <code>text</code>, <code>options</code>, <code>scores</code>, et facultativement <code>subscale</code> (sous-échelle).</small>
    </div>

    <div class="form-group">
        <label for="scoring_method">Méthode de cotation</label>
        <textarea id="scoring_method" name="scoring_method" rows="4">{{ form.get('scoring_method', '') }}</textarea>
    </div>

    <div class="form-group">
        <label for="interpretation">Interprétation</label>
        <textarea id="interpretation" name="interpretation" rows="4">{{ form.get('interpretation', '') }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Créer le questionnaire</button>
        <a href="{{ url_for('questionnaires.list_questionnaires') }}" class="btn btn-secondary">Annuler</a>
    </div>
</form>
{% endblock %}
